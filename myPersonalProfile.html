<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./myPersonalProfile.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- MY PERSONAL PROFILE
                       ↑
                 Element selector
                       │
                       ↓
              ┌─────────────────┐
              │                 │
              │  Profile Card   │ ← Class selector
              │                 │
              │  Name: ...      │
              │  Email: ...     │
              │                 │
              └─────────────────┘
                ↑             ↑
              Border         Border
                │
          ←── Padding ──→
                
       ←──────── Margin ────────→ -->
    <div class="container">
      <h1>MINE PERSONAL PROFILE</h1>

      <main class="main">
        <h2>Profile Card</h2>
        <form>
          <label for="profileName"
            >Name: <input id="profileName" placeholder="enter name" /> </label
          ><br />
          <label for="Email">
            Email: <input id="Email" placeholder="enter Email" /> </label
          ><br />
          <input type="button" value="Profile Update" />
        </form>
      </main>
      <footer>copyright @2026</footer>
    </div>
  </body>
</html>
