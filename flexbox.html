<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="flexbox.css" />
    <title>FLEX BOX PROPERTIES</title>

  <body>
    <!--
              STUDENT DASHBOARD

┌─────────────────────────────────────────────┐
│                                             │
│   ┌─────────┐   ┌─────────┐   ┌─────────┐ │
│   │ Student │   │ Student │   │ Student │ │
│   │    1    │   │    2    │   │    3    │ │
│   └─────────┘   └─────────┘   └─────────┘ │
│                                             │
└─────────────────────────────────────────────┘    
-->

    <h1>STUDENT DASHBOARD</h1>
    <div class="container">
      <div class="child item-1">Student 1</div>
      <div class="child item-2">Student 2</div>
      <div class="child item-3">Student 3</div>
    </div>
  </body>
